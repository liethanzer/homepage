<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#08090f" />
<meta name="format-detection" content="telephone=no" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="搜索" />
<title>主页</title>
<style>
  :root {
    color-scheme: dark;
    --glass-bg:           rgba(255, 255, 255, 0.14);
    --glass-bg-focus:     rgba(255, 255, 255, 0.20);
    --glass-border:       rgba(255, 255, 255, 0.28);
    --glass-border-focus: rgba(255, 255, 255, 0.50);
    --blur: 28px;
    --sat: 180%;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    height: 100%;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  /* ============ 页面骨架：dvh + 安全区 + 可滚动居中 ============ */
  body {
    min-height: 100vh;
    min-height: 100dvh;                 /* 移动端动态视口，随地址栏折叠自适应 */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    /* 刘海 / 灵动岛 / Home 指示条安全区 */
    padding-top:    env(safe-area-inset-top, 0px);
    padding-right:  env(safe-area-inset-right, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left:   env(safe-area-inset-left, 0px);

    background: #08090f;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: none;          /* 去掉 iOS 橡皮筋/下拉刷新 */

    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                 "Helvetica Neue", "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;         /* 移除移动端 300ms 点击延迟 */
  }

  /* ============ 背景彩色光斑 ============ */
  .bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
    background: radial-gradient(120% 100% at 50% 0%, #12122a 0%, #08090f 62%);
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    mix-blend-mode: screen;
    will-change: transform;
    transform: translateZ(0);
    pointer-events: none;
  }

  .b1 { width: 46vmax; height: 46vmax; left: -12vmax;  top: -14vmax;    background: #5b4dff; opacity: .90; animation: d1 22s ease-in-out infinite alternate; }
  .b2 { width: 40vmax; height: 40vmax; right: -10vmax; bottom: -14vmax; background: #ff3d7f; opacity: .80; animation: d2 26s ease-in-out infinite alternate; }
  .b3 { width: 34vmax; height: 34vmax; right: 8vmax;   top: -8vmax;     background: #00d0ff; opacity: .60; animation: d3 30s ease-in-out infinite alternate; }
  .b4 { width: 26vmax; height: 26vmax; left: 10vmax;   bottom: -10vmax; background: #ff9d2e; opacity: .45; animation: d2 24s ease-in-out infinite alternate-reverse; }

  @keyframes d1 { from { transform: translate3d(0, 0, 0) scale(1);    } to { transform: translate3d(6vmax, 8vmax, 0) scale(1.15); } }
  @keyframes d2 { from { transform: translate3d(0, 0, 0) scale(1.10); } to { transform: translate3d(-8vmax, -6vmax, 0) scale(1); } }
  @keyframes d3 { from { transform: translate3d(0, 0, 0) scale(1);    } to { transform: translate3d(-6vmax, 10vmax, 0) scale(1.20); } }

  /* ============ 主内容 ============ */
  .wrap {
    width: 100%;
    margin-block: auto;                 /* 居中但内容超高时可正常滚动 */
    padding-inline: max(20px, 5vw);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .title {
    margin-bottom: clamp(22px, 4.5vh, 40px);
    font-size: clamp(32px, 6.2vw, 56px);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.1;
    text-align: center;
    user-select: none;
    -webkit-user-select: none;
    background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.68) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 6px 26px rgba(0, 0, 0, 0.45));
  }

  /* ---------- 毛玻璃搜索框 ---------- */
  .searchbar {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    width: min(680px, 100%);
    height: 64px;
    padding: 0 8px 0 20px;
    border-radius: 32px;
    -webkit-appearance: none;
    appearance: none;

    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    box-shadow:
      0 10px 36px rgba(0, 0, 0, 0.38),
      0 2px 8px rgba(0, 0, 0, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.45),
      inset 0 -1px 0 rgba(255, 255, 255, 0.08);

    -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat));
    backdrop-filter: blur(var(--blur)) saturate(var(--sat));

    transition:
      transform .3s cubic-bezier(.2, .9, .3, 1.15),
      background .3s ease,
      border-color .3s ease,
      box-shadow .3s ease;
  }

  .searchbar:focus-within {
    transform: translateY(-2px) scale(1.012);
    background: var(--glass-bg-focus);
    border-color: var(--glass-border-focus);
    box-shadow:
      0 16px 48px rgba(0, 0, 0, 0.45),
      0 0 0 4px rgba(255, 255, 255, 0.07),
      inset 0 1px 0 rgba(255, 255, 255, 0.55);
  }

  .icon {
    flex: none;
    width: 21px;
    height: 21px;
    color: rgba(255, 255, 255, 0.65);
    transition: color .25s ease;
    pointer-events: none;
  }
  .searchbar:focus-within .icon { color: rgba(255, 255, 255, 0.92); }

  #q {
    flex: 1;
    min-width: 0;
    height: 100%;
    border: 0;
    outline: 0;
    border-radius: 0;
    background: transparent;
    color: #fff;
    font-family: inherit;
    font-size: 17px;                    /* ≥16px，避免 iOS 聚焦时页面自动放大 */
    letter-spacing: .2px;
    caret-color: #8fa8ff;
    -webkit-appearance: none;
    appearance: none;
    user-select: text;
    -webkit-user-select: text;
  }
  #q::placeholder {
    color: rgba(255, 255, 255, 0.52);
    font-size: 16px;
  }

  .go {
    flex: none;
    width: 48px;                        /* 触摸目标 ≥ 44px */
    height: 48px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.30);
    background: rgba(255, 255, 255, 0.20);
    color: #fff;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    transition: background .2s ease, transform .15s ease;
    touch-action: manipulation;
  }
  .go svg { width: 20px; height: 20px; }
  .go:active { transform: scale(0.92); }
  .go:focus-visible {
    outline: 2px solid rgba(255, 255, 255, 0.7);
    outline-offset: 3px;
  }

  /* hover 只在真正有鼠标时生效，避免触摸设备“粘住” */
  @media (hover: hover) and (pointer: fine) {
    .go:hover { background: rgba(255, 255, 255, 0.34); }
  }

  /* ============ 关键词前缀提示（毛玻璃胶囊） ============ */
  .hints {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 10px;
    width: min(680px, 100%);
    margin-top: clamp(14px, 2.6vh, 24px);
    padding: 0 2px;
  }

  .hint {
    --c: rgba(255, 255, 255, 0.6);
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 34px;
    padding: 0 13px 0 11px;
    border-radius: 17px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.075);
    color: rgba(255, 255, 255, 0.70);
    font-family: inherit;
    font-size: 12.5px;
    line-height: 1;
    white-space: nowrap;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    -webkit-backdrop-filter: blur(14px) saturate(150%);
    backdrop-filter: blur(14px) saturate(150%);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition:
      background .22s ease,
      border-color .22s ease,
      color .22s ease,
      transform .18s cubic-bezier(.2, .9, .3, 1.2),
      box-shadow .22s ease;
    animation: hintIn .55s cubic-bezier(.2, .9, .3, 1.1) both;
  }

  @keyframes hintIn {
    from { opacity: 0; transform: translateY(9px) scale(.94); }
    to   { opacity: 1; transform: none; }
  }

  .hint .dot {
    width: 6px;
    height: 6px;
    flex: none;
    border-radius: 50%;
    background: var(--c);
    box-shadow: 0 0 8px var(--c);
  }

  .hint .k {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-weight: 600;
    font-size: 12.5px;
    color: rgba(255, 255, 255, 0.95);
    letter-spacing: .2px;
  }

  .hint .n { opacity: .68; }

  .hint:active { transform: scale(.95); }

  .hint:focus-visible {
    outline: 2px solid rgba(255, 255, 255, 0.6);
    outline-offset: 2px;
  }

  @media (hover: hover) and (pointer: fine) {
    .hint:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.32);
      color: #fff;
      transform: translateY(-1.5px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
    }
    .hint:hover .n { opacity: .9; }
  }

  /* ============ 手机 / 触屏设备：性能与手感优化 ============ */
  @media (max-width: 820px), (pointer: coarse) {
    :root { --blur: 20px; --sat: 150%; }

    /* 大面积 blur + 混合模式在手机上很耗 GPU：降低模糊、关闭混合与动画 */
    .blob {
      filter: blur(48px);
      mix-blend-mode: normal;
      animation: none !important;
      will-change: auto;
    }
    .b1 { opacity: .52; }
    .b2 { opacity: .46; }
    .b3 { opacity: .36; }
    .b4 { opacity: .30; }

    /* 移动端聚焦不做缩放位移，防止键盘弹起时抖动 */
    .searchbar:focus-within {
      transform: none;
      background: var(--glass-bg-focus);
      border-color: var(--glass-border-focus);
    }

    /* 多个胶囊各带 backdrop-filter 开销大：改用纯半透明底 */
    .hint {
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
      background: rgba(255, 255, 255, 0.10);
    }

    .hints { gap: 7px 8px; }
    .hint { height: 32px; font-size: 12px; padding: 0 11px 0 9px; }
  }

  /* ============ 手机竖屏细化 ============ */
  @media (max-width: 600px) {
    .title { font-size: clamp(30px, 9vw, 44px); }

    .searchbar {
      height: 58px;
      border-radius: 29px;
      padding: 0 6px 0 16px;
      gap: 10px;
    }
    .icon { width: 19px; height: 19px; }
    #q { font-size: 16px; }
    #q::placeholder { font-size: 15px; }
    .go { width: 46px; height: 46px; }
    .go svg { width: 19px; height: 19px; }

    .hints { gap: 6px 7px; }
    .hint { height: 30px; font-size: 11.5px; padding: 0 10px 0 8px; border-radius: 15px; }
    .hint .k { font-size: 11.5px; }
  }

  /* ============ 横屏手机：矮屏幕压缩布局 ============ */
  @media (max-height: 500px) and (orientation: landscape) {
    .title {
      font-size: 26px;
      margin-bottom: 12px;
    }
    .searchbar {
      height: 48px;
      border-radius: 24px;
      padding: 0 5px 0 14px;
    }
    .go { width: 40px; height: 40px; }
    .hints { margin-top: 10px; gap: 6px; }
    .hint { height: 26px; font-size: 11px; padding: 0 9px 0 8px; }
    .hint:nth-child(n+7) { display: none; }   /* 太挤时只保留前 6 个 */
  }

  /* ============ 平板：保持居中，略微加大尺寸 ============ */
  @media (min-width: 768px) and (min-height: 600px) {
    .searchbar { height: 66px; border-radius: 33px; }
    .title { margin-bottom: clamp(28px, 5vh, 46px); }
    .hints { margin-top: clamp(18px, 3vh, 28px); gap: 10px 12px; }
    .hint { height: 36px; font-size: 13px; padding: 0 15px 0 12px; border-radius: 18px; }
    .hint .k { font-size: 13px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none !important; }
    .searchbar, .go, .icon, .hint { transition: none; }
    .hint { animation: none !important; }
  }
</style>
</head>
<body>

  <!-- 背景光斑 -->
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="blob b4"></span>
  </div>

  <main class="wrap">
    <h1 class="title">Search</h1>

    <form class="searchbar" id="form" role="search"
          autocomplete="off" action="#" method="get">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-3.6-3.6"></path>
      </svg>

      <input id="q" name="q" type="text" aria-label="搜索"
             inputmode="search" enterkeyhint="search"
             placeholder="用 Google 搜索，或试试 bd / bing 前缀…"
             autocomplete="off" autocorrect="off" autocapitalize="off"
             spellcheck="false" />

      <button class="go" type="submit" aria-label="搜索">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h13"></path>
          <path d="m12 5 7 7-7 7"></path>
        </svg>
      </button>
    </form>

    <!-- 关键词前缀提示：点击即填入前缀 -->
    <div class="hints" id="hints" role="group" aria-label="搜索前缀快捷方式"></div>
  </main>

<script>
(function () {
  'use strict';

  /* ============ 搜索引擎表 ============ */
  /* 键名即前缀（不区分大小写），可自由增删 */
  const enc = encodeURIComponent;
  const engines = {
    g:      { url: q => 'https://www.google.com/search?q=' + enc(q) },
    google: { url: q => 'https://www.google.com/search?q=' + enc(q) },

    bd:     { url: q => 'https://www.baidu.com/s?wd=' + enc(q) },
    baidu:  { url: q => 'https://www.baidu.com/s?wd=' + enc(q) },

    bing:   { url: q => 'https://www.bing.com/search?q=' + enc(q) },
    bi:     { url: q => 'https://www.bing.com/search?q=' + enc(q) },

    gh:     { url: q => 'https://github.com/search?q=' + enc(q) },
    github: { url: q => 'https://github.com/search?q=' + enc(q) },

    yt:     { url: q => 'https://www.youtube.com/results?search_query=' + enc(q) },
    bili:   { url: q => 'https://search.bilibili.com/all?keyword=' + enc(q) },
    zh:     { url: q => 'https://www.zhihu.com/search?type=content&q=' + enc(q) },
    wiki:   { url: q => 'https://zh.wikipedia.org/w/index.php?search=' + enc(q) },
    tb:     { url: q => 'https://s.taobao.com/search?q=' + enc(q) },
    npm:    { url: q => 'https://www.npmjs.com/search?q=' + enc(q) }
  };

  const DEFAULT_KEY = 'g';   // 默认谷歌

  /* ============ 搜索框占位文案（说明默认走 Google） ============ */
  const PH_DESKTOP = '默认 Google 搜索';
  const PH_MOBILE  = 'Google 搜索';

  /* ============ 下方前缀提示（顺序即展示顺序） ============ */
  const HINTS = [
    { key: 'bd',   name: '百度',    color: '#4e6ef2' },
    { key: 'bing', name: '必应',    color: '#0ea5e9' },
    { key: 'gh',   name: 'GitHub',  color: '#e6edf3' },
    { key: 'bili', name: '哔哩哔哩', color: '#fb7299' },
    { key: 'zh',   name: '知乎',    color: '#3b8cff' },
    { key: 'wiki', name: '维基',    color: '#d0d0d0' },
    { key: 'yt',   name: 'YouTube', color: '#ff4444' },
    { key: 'tb',   name: '淘宝',    color: '#ff7a1a' }
  ];

  /* ============ 解析输入 ============ */
  function resolve(raw) {
    const text = String(raw || '').trim();
    if (!text) return null;

    // 匹配「前缀 + 空格 + 关键词」
    const m = text.match(/^(\S+)[\s\u3000]+([\s\S]+)$/);
    if (m) {
      const key  = m[1].toLowerCase();
      const rest = m[2].trim();
      if (rest && Object.prototype.hasOwnProperty.call(engines, key)) {
        return engines[key].url(rest);
      }
    }
    // 没有前缀（或前缀无效）→ 默认谷歌搜整句
    return engines[DEFAULT_KEY].url(text);
  }

  /* ============ DOM ============ */
  const form   = document.getElementById('form');
  const input  = document.getElementById('q');
  const hintsEl = document.getElementById('hints');

  /* ---------- 占位文案随屏幕宽度切换 ---------- */
  const narrowMQ = window.matchMedia('(max-width: 480px)');
  function applyPlaceholder() {
    input.placeholder = narrowMQ.matches ? PH_MOBILE : PH_DESKTOP;
  }
  applyPlaceholder();
  if (narrowMQ.addEventListener) {
    narrowMQ.addEventListener('change', applyPlaceholder);
  } else if (narrowMQ.addListener) {         // 旧版 Safari 兜底
    narrowMQ.addListener(applyPlaceholder);
  }

  /* ---------- 生成前缀胶囊 ---------- */
  HINTS.forEach(function (h, i) {
    if (!Object.prototype.hasOwnProperty.call(engines, h.key)) return;  // 前缀无效则不展示

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'hint';
    btn.dataset.key = h.key;
    btn.style.setProperty('--c', h.color);
    btn.style.animationDelay = (0.05 * i + 0.08).toFixed(2) + 's';
    btn.setAttribute('aria-label', '使用 ' + h.name + ' 搜索');

    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.setAttribute('aria-hidden', 'true');

    const k = document.createElement('span');
    k.className = 'k';
    k.textContent = h.key;

    const n = document.createElement('span');
    n.className = 'n';
    n.textContent = h.name;

    btn.appendChild(dot);
    btn.appendChild(k);
    btn.appendChild(n);

    // 点击：填入「前缀 + 空格」并聚焦输入框，光标落到末尾
    btn.addEventListener('click', function () {
      input.value = h.key + ' ';
      input.focus({ preventScroll: true });
      try { input.setSelectionRange(input.value.length, input.value.length); } catch (err) {}
    });

    hintsEl.appendChild(btn);
  });

  /* ---------- 提交 ---------- */
  function submit() {
    const url = resolve(input.value);
    if (url) window.location.href = url;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    submit();
  });

  // 回车提交（兼容中文输入法选词时的回车）
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.isComposing) {
      e.preventDefault();
      submit();
    }
  });

  // 点击搜索框内非按钮区域（图标 / 留白）时聚焦输入框，手机端更好点
  form.addEventListener('click', function (e) {
    if (e.target.closest('.go')) return;
    if (document.activeElement !== input) input.focus({ preventScroll: true });
  });

  const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)');

  // 桌面端自动聚焦；手机/平板不自动聚焦，避免一打开就弹键盘
  if (finePointer.matches) {
    input.focus({ preventScroll: true });

    // 桌面端：点击页面空白处也回到输入框
    document.addEventListener('click', function (e) {
      if (e.target.closest('form') || e.target.closest('button')) return;
      input.focus({ preventScroll: true });
    });
  }
})();
</script>
</body>
</html>
